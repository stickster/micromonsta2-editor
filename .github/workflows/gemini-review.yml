name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GEMINI_CLI_TRUST_WORKSPACE: 'true'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Run automatically on opened/synchronized PRs (skipping main -> release), or on-demand via comment
    if: >
      (github.event_name == 'pull_request' &&
       !(github.head_ref == 'main' && github.base_ref == 'release')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.login != 'github-actions[bot]' &&
       (contains(github.event.comment.body, '@gemini-cli /review') || contains(github.event.comment.body, '/review')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Authenticate GitHub CLI
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | gh auth login --with-token

      - name: Run Gemini PR Review
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: 'gemini-4-hydrogen'
          settings: |
            {
              "modelConfigs": {
                "overrides": [
                  {
                    "match": {
                      "model": "gemini-4-hydrogen"
                    },
                    "modelConfig": {
                      "generateContentConfig": {
                        "thinkingConfig": {
                          "thinkingLevel": "MEDIUM"
                        }
                      }
                    }
                  }
                ]
              }
            }
          prompt: |
            Review pull request #${{ github.event.pull_request.number || github.event.issue.number }} against the guidelines in AGENTS.md, .agents/rules/, and GEMINI.md.
            First, inspect the PR details and diff using `gh pr view ${{ github.event.pull_request.number || github.event.issue.number }}` and `gh pr diff ${{ github.event.pull_request.number || github.event.issue.number }}`.
            Verify adherence to Vanilla JS architecture (no bundlers/frameworks), MicroMonsta 2 SysEx/NRPN specifications, and test suite requirements (`node tests/cli-runner.js`).
            You MUST post your review feedback directly on the pull request using `gh pr review ${{ github.event.pull_request.number || github.event.issue.number }} --comment --body "..."` (or `--approve` if ready). Do not only output the review to stdout.
