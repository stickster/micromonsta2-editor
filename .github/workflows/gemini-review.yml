name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Run automatically on opened/synchronized PRs, or on-demand via comment
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.login != 'github-actions[bot]' &&
       (contains(github.event.comment.body, '@gemini-cli /review') || contains(github.event.comment.body, '/review')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Gemini PR Review
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: 'gemini-4-hydrogen'
          settings: |
            {
              "modelConfigs": {
                "overrides": [
                  {
                    "match": {
                      "model": "gemini-4-hydrogen"
                    },
                    "modelConfig": {
                      "generateContentConfig": {
                        "thinkingConfig": {
                          "thinkingLevel": "MEDIUM"
                        }
                      }
                    }
                  }
                ]
              }
            }
          prompt: |
            Review this pull request against the guidelines in GEMINI.md.
            Verify adherence to Vanilla JS architecture (no bundlers/frameworks), MicroMonsta 2 SysEx/NRPN specifications, and test suite requirements (`node tests/cli-runner.js`).
            Provide clear, actionable feedback or approve if ready.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
