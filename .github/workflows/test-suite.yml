name: Tests

on:
  pull_request:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run CLI Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run test suite
        run: node tests/cli-runner.js

