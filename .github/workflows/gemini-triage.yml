name: Gemini Issue Triage

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to triage'
        required: true
        type: string

permissions:
  contents: read
  issues: write
  actions: write

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GEMINI_CLI_TRUST_WORKSPACE: 'true'

jobs:
  triage:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.user.login != 'github-actions[bot]') ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       github.event.comment.user.login != 'github-actions[bot]' &&
       (contains(github.event.comment.body, '@gemini-cli /triage') || contains(github.event.comment.body, '/triage')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Authenticate GitHub CLI
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | env -u GH_TOKEN -u GITHUB_TOKEN gh auth login --with-token

      - name: Run Gemini Issue Triage
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: 'gemini-4-hydrogen'
          settings: |
            {
              "modelConfigs": {
                "overrides": [
                  {
                    "match": {
                      "model": "gemini-4-hydrogen"
                    },
                    "modelConfig": {
                      "generateContentConfig": {
                        "thinkingConfig": {
                          "thinkingLevel": "LOW"
                        }
                      }
                    }
                  }
                ]
              }
            }
          prompt: |
            Triage issue #${{ github.event.inputs.issue_number || github.event.issue.number }}: "${{ github.event.issue.title }}".
            First, inspect the full issue details and comments using `gh issue view ${{ github.event.inputs.issue_number || github.event.issue.number }}`.
            Evaluate the issue against AGENTS.md, .agents/rules/, and GEMINI.md:
            1. Check if the issue involves hardware limitations that cannot be handled over MIDI (such as combi parameters or global system settings). If so, politely explain this limitation in a comment on the issue via `gh issue comment ${{ github.event.inputs.issue_number || github.event.issue.number }} --body "..."` and do NOT queue a fix.
            2. Classify the issue (`bug`, `enhancement`, `question`) and apply relevant labels using `gh issue edit ${{ github.event.inputs.issue_number || github.event.issue.number }} --add-label "..."`.
            3. If the bug report is missing essential reproduction steps or firmware details, add the `triage:needs-info` label (`gh issue edit ${{ github.event.inputs.issue_number || github.event.issue.number }} --add-label "triage:needs-info"`), post a helpful comment requesting the missing information via `gh issue comment`, and do NOT queue a fix.
            4. If the issue is clear and actionable (a `bug` or `enhancement` with sufficient detail):
               - Add the `triage:ready-for-fix` label using `gh issue edit ${{ github.event.inputs.issue_number || github.event.issue.number }} --add-label "triage:ready-for-fix"`.
               - Post a comment on the issue summarizing the implementation plan using `gh issue comment ${{ github.event.inputs.issue_number || github.event.issue.number }} --body "..."`.
               - Dispatch the assistant workflow to attempt a fix/PR using `gh workflow run gemini-assist.yml -f issue_number=${{ github.event.inputs.issue_number || github.event.issue.number }}`.
            5. Always post your triage response directly on the issue using `gh issue comment`; do not only output the response to stdout.
