name: Gemini Issue Triage

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to triage'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  triage:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.user.login != 'github-actions[bot]') ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       github.event.comment.user.login != 'github-actions[bot]' &&
       (contains(github.event.comment.body, '@gemini-cli /triage') || contains(github.event.comment.body, '/triage')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Gemini Issue Triage
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Triage issue #${{ github.event.inputs.issue_number || github.event.issue.number }}: "${{ github.event.issue.title }}".
            Evaluate the issue against GEMINI.md:
            1. Check if the issue involves hardware limitations that cannot be handled over MIDI (such as combi parameters or global system settings). If so, politely explain this limitation to the user.
            2. Classify the issue (bug, enhancement, question) and apply relevant labels using the GitHub CLI (`gh issue edit`).
            3. If the bug report is missing essential reproduction steps or firmware details, post a helpful comment requesting the missing information.
            4. If the issue is clear and actionable, summarize the implementation plan.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
